name: QA

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - uses: ramsey/composer-install@v3

      - name: PHPStan
        run: composer phpstan

      - name: PHP-CS-Fixer
        run: composer cs

      - name: Rector
        run: composer rector

  tests:
    # Job names are required status checks in the branch protection of main and develop
    name: tests (PHP ${{ matrix.php }}, ${{ matrix.deps }}${{ matrix.symfony && format(', Symfony {0}', matrix.symfony) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.4', deps: highest }
          - { php: '8.5', deps: highest }
          # Static tools are version dependent, the lowest jobs only check the runtime constraints.
          # Plain lowest resolves to Symfony 7.4.0, the pinned entries cover the newest 7.4 and the lowest 8.x.
          - { php: '8.4', deps: lowest }
          - { php: '8.4', deps: highest, symfony: '7.4.*' }
          - { php: '8.4', deps: lowest, symfony: '^8.0' }
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Pin Symfony ${{ matrix.symfony }}
        if: matrix.symfony
        run: |
          composer require --no-update "symfony/clock:${{ matrix.symfony }}" "symfony/http-client:${{ matrix.symfony }}" "symfony/rate-limiter:${{ matrix.symfony }}"
          composer require --no-update --dev "symfony/cache:${{ matrix.symfony }}"

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.deps }}

      - name: Show Symfony versions
        run: composer show | grep -E '^symfony/(clock|http-client|rate-limiter) '

      - name: PHPUnit
        run: composer test
